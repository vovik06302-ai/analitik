name: Build CI (Node.js 22 + Vite + Express)

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
      - 'V*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Run Unit Tests
        run: npx --yes tsx --test server/*.test.ts src/utils/*.test.ts

      - name: Build Production Bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearlAiAnalyst-web-dist
          path: |
            dist/
            server.js
            package.json
          retention-days: 7
