name: Build CI (Windows .NET 10)

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
      - 'V*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore PearlAiAnalyst.sln

      - name: Build Release
        shell: pwsh
        run: dotnet build PearlAiAnalyst.sln -c Release --no-restore

      - name: Publish win-x64 check
        shell: pwsh
        run: |
          dotnet publish PearlAiAnalyst/PearlAiAnalyst.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearlAiAnalyst-win-x64
          path: ./publish
          retention-days: 7
