name: Build and Release Pearl AI Analyst

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например, 1.1.0; если пусто — берётся из package.json)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve version and tag
        id: version
        run: |
          INPUT_VER="${{ inputs.version }}"
          INPUT_VER="${INPUT_VER#v}"
          INPUT_VER="${INPUT_VER#V}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VER="${TAG#v}"
            VER="${VER#V}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
            VER="${VER#V}"
          elif [ -n "$INPUT_VER" ]; then
            VER="$INPUT_VER"
            TAG="v$VER"
          else
            VER="$(node -p "require('./package.json').version")"
            TAG="v$VER"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Run Unit Tests
        run: npx --yes tsx --test server/*.test.ts src/utils/*.test.ts

      - name: Build Production Bundle
        run: npm run build

      - name: Package Release Archive
        run: |
          mkdir -p release-staging Releases
          cp -r dist release-staging/dist
          cp server.js package.json package-lock.json .env.example README.md release-staging/
          tar -czf "Releases/PearlAiAnalyst-v${{ steps.version.outputs.version }}-web.tar.gz" -C release-staging .
          (cd release-staging && zip -r "../Releases/PearlAiAnalyst-v${{ steps.version.outputs.version }}-web.zip" .)

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VER="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --target "${{ github.sha }}" \
              --title "Pearl AI Analyst v$VER" \
              --notes "Pearl AI Analyst v$VER (Live PEARL/USDT Market, Multi-Model AI Council, News Radar, SQLite History Audit, Telegram/Webhook Alerts)."
          fi
          gh release upload "$TAG" Releases/* --clobber --repo "$REPO"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PearlAiAnalyst-Release-${{ steps.version.outputs.version }}
          path: Releases/
          retention-days: 14
