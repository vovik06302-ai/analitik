name: Build and Release Pearl AI Analyst

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например, 1.1.0; если пусто — берётся из package.json)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve version and tag
        id: version
        run: |
          INPUT_VER="${{ inputs.version }}"
          INPUT_VER="${INPUT_VER#v}"
          INPUT_VER="${INPUT_VER#V}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VER="${TAG#v}"
            VER="${VER#V}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
            VER="${VER#V}"
          elif [ -n "$INPUT_VER" ]; then
            VER="$INPUT_VER"
            TAG="v$VER"
          else
            VER="$(node -p "require('./package.json').version")"
            TAG="v$VER"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sync APP_VERSION with release version
        run: sed -i "s/APP_VERSION = '[^']*'/APP_VERSION = '${{ steps.version.outputs.version }}'/" src/types.ts

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Run Unit Tests
        run: npx --yes tsx --test server/*.test.ts src/utils/*.test.ts

      - name: Build Production Bundle
        run: npm run build

      - name: Package Release Archive
        run: |
          mkdir -p release-staging Releases
          cp -r dist release-staging/dist
          cp server.js package.json .env.example README.md release-staging/
          [ -f package-lock.json ] && cp package-lock.json release-staging/ || true
          tar -czf "Releases/PearlAiAnalyst-v${{ steps.version.outputs.version }}-web.tar.gz" -C release-staging .
          (cd release-staging && zip -r "../Releases/PearlAiAnalyst-v${{ steps.version.outputs.version }}-web.zip" .)

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VER="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --target "${{ github.sha }}" \
              --title "Pearl AI Analyst v$VER" \
              --notes "Pearl AI Analyst v$VER (Live PEARL/USDT Market, Multi-Model AI Council, News Radar, SQLite History Audit, Telegram/Webhook Alerts)."
          fi
          gh release upload "$TAG" Releases/* --clobber --repo "$REPO"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PearlAiAnalyst-Release-${{ steps.version.outputs.version }}
          path: Releases/
          retention-days: 14

  windows-installer:
    needs: release
    runs-on: windows-latest
    env:
      VER: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync APP_VERSION with release version
        shell: bash
        run: sed -i "s/APP_VERSION = '[^']*'/APP_VERSION = '$VER'/" src/types.ts

      - name: Install dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Build desktop bundle
        shell: bash
        run: npm run build:desktop

      - name: Build Windows installer
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never -c.extraMetadata.version="$VER"

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\win-unpacked -Filter *.exe | Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
          Write-Host "Testing $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed, exit code $($p.ExitCode)" }

      - name: Upload installer to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls installer
          gh release upload "$TAG" "installer/PearlAiAnalyst-Setup-$VER.exe" --clobber --repo "${{ github.repository }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearlAiAnalyst-Setup-${{ needs.release.outputs.version }}
          path: installer/PearlAiAnalyst-Setup-*.exe
          retention-days: 14
